
name: Astra Local - Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Extract sources
        run: |
          unzip -q AstraLocal-V0.1.zip -d /tmp/astra
          cp -a /tmp/astra/AstraLocal-V0.1/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.13113456' \
            'cmake;3.31.6'

      - name: Get llama.cpp
        run: |
          git clone --depth 1 --branch v0.6.0 \
            https://github.com/ggml-org/llama.cpp.git \
            vendor/llama.cpp

      - name: Prepare Astra Local
        run: python3 scripts/prepare.py

      - name: Build APK
        working-directory: vendor/llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AstraLocal-V0.1-Android-APK
          path: vendor/llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
